<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 03 - Colors and Opacity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Color Models</h2>
  <div class="palette-container">
    <div class="swatch named">Named (Crimson)</div>
    <div class="swatch hex">HEX (#2563eb)</div>
    <div class="swatch rgb">RGB (rgb(16, 185, 129))</div>
    <div class="swatch rgba">RGBA (rgba(245, 158, 11, 0.7))</div>
  </div>

  <h2>Opacity vs RGBA Transparency</h2>
  <div class="comparison-container">
    <div class="box box-opacity">
      <p>Using <code>opacity: 0.5</code></p>
      <span>This text becomes transparent too.</span>
    </div>

    <div class="box box-rgba">
      <p>Using <code>rgba(..., 0.5)</code></p>
      <span>This text stays 100% solid and clear.</span>
    </div>
  </div>

</body>
</html>
